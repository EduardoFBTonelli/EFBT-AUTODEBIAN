#_preseed_V1

##LOCALE##
d-i debian-installer/language string en
d-i debian-installer/country string BR
d-i debian-installer/locale string en_GB.UTF-8
# Configuração de localidade, com idioma em inglês, país Brasil #
# e localidade britanica para data DD/MM/AAAA                   #

##KEYBOARD##
d-i keyboard-configuration/xkb-keymap select br
d-i keyboard-configuration/layoutcode string br
d-i keyboard-configuration/toggle select No toggling 
# "Configuração de teclado fixa em ABNT2, desabilitando teclas de alternância de layout (toggle) #
#  para evitar conflitos de atalhos no console e garantir uma instalação 100% unattended."       #

##NETWORK##
d-i netcfg/link_wait_timeout string 10
d-i netcfg/choose_interface select auto
d-i netcfg/disable_autoconfig boolean false
d-i netcfg/dhcp_failed note
d-i netcfg/dhcp_options select Configure network manually
# Define o timeout para 10S, seleciona a interface de rede automaticamente e tenta DHCP #
# Caso falha no DHCP, configura a rede manualmente conforme blocos "IPV4" e "IPV6"      #

#IPV4
#d-i netcfg/get_ipaddress string 192.168.1.42
#d-i netcfg/get_netmask string 255.255.255.0
#d-i netcfg/get_gateway string 192.168.1.1
#d-i netcfg/get_nameservers string 192.168.1.1
#d-i netcfg/confirm_static boolean true

#IPV6
#d-i netcfg/get_ipaddress string fc00::2
#d-i netcfg/get_netmask string ffff:ffff:ffff:ffff::
#d-i netcfg/get_gateway string fc00::1
#d-i netcfg/get_nameservers string fc00::1
#d-i netcfg/confirm_static boolean true

#d-i netcfg/get_hostname string unassigned-hostname
#d-i netcfg/get_domain string unassigned-domain
# Define hostname e domínio padrão caso DHCP não retorne #

d-i netcfg/get_hostname string servidor-padrao
d-i netcfg/get_domain string local
# Define hostname e domínio personalizados IGNORANDO DHCP #

d-i netcfg/wireless_wep string
# Esta linha serve para "calar" a pergunta sobre chaves de segurança Wi-Fi #

d-i hw-detect/load_firmware boolean true
# Garante que drivers de rede sejam carregados sem perguntas #

## MIRROR##
d-i mirror/country string manual
# Configura o país do mirror para "manual" para evitar perguntas sobre localização #
d-i mirror/http/hostname string deb.debian.org
# Configura o hostname do mirror para deb.debian.org, garantindo acesso ao repositório oficial no BR #
d-i mirror/http/directory string /debian
# Configura o diretório do mirror para /debian, que é o caminho correto para os repositórios Debian #
d-i mirror/http/proxy string
# Deixa o campo de proxy em branco para evitar perguntas sobre configuração de proxy #  

##ACC_SETUP##
d-i passwd/root-login boolean true
d-i passwd/make-user boolean true
# Configura o sistema para permitir login como root e criar um usuário durante a instalação #

d-i passwd/root-password password r00tme
d-i passwd/root-password-again password r00tme

d-i passwd/user-fullname string Debian User
d-i passwd/username string debian

d-i passwd/user-password password 123123
d-i passwd/user-password-again password 123123

d-i passwd/user-default-groups string sudo

##CLOCK##
d-i clock-setup/utc boolean true
d-i time/zone string America/Sao_Paulo
d-i clock-setup/ntp boolean true

##PARTITION##
d-i partman-auto/init_automatically_partition select biggest_free
#d-i partman-auto/disk string /dev/sda
d-i partman/early_command string debconf-set partman-auto/disk "$(list-devices disk | head -n1)"
d-i partman-auto/method string lvm
d-i partman-auto-lvm/guided_size string 10GB
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-efi/non_efi_system boolean true
d-i partman-partitioning/choose_label select gpt
d-i partman-partitioning/default_label string gpt
d-i partman/mount_style select traditional

##BASE_SYSTEM##
d-i base-installer/install-recommends boolean true

##APT_SETUP##
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/disable-cdrom-entries boolean true
d-i apt-setup/use_mirror boolean true
d-i apt-setup/services-select multiselect security, updates
d-i apt-setup/security_host string security.debian.org
d-i apt-setup/updates_host string deb.debian.org
#d-i apt-setup/multiarch string i386

##PACKAGE_SELECTION##
d-i pkgsel/include string sudo openssh-server curl nano
d-i pkgsel/upgrade select safe-upgrade
popularity-contest popularity-contest/participate boolean false

##BOOTLOADER##
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default

##FINISH##
d-i finish-install/keep-consoles boolean true
d-i finish-install/reboot_in_progress note
d-i cdrom-detect/eject boolean false